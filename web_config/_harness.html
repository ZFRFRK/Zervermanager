<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;height:100%}iframe{border:0;width:100vw;height:100vh;display:block}</style></head>
<body>
<iframe id="f" src="index.html?b=3"></iframe>
<script>
  var page = new URLSearchParams(location.search).get('page') || 'dashboard';
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    setTimeout(function () { try { f.contentWindow.switchPage(page); } catch (e) {} }, 900);
  });
</script>
</body>
</html>
