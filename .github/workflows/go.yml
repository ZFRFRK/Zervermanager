name: go-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: zervermanager-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...

  # The prebuilts in bin/ are committed so fresh servers install with no Go
  # toolchain. This job rebuilds and flags them if they drift from source.
  prebuild-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: zervermanager-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: rebuild amd64 and compare against committed bin/
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/zm-amd64 ./cmd/zervermanager
          if [ -f bin/zervermanager-linux-amd64 ]; then
            cmp /tmp/zm-amd64 bin/zervermanager-linux-amd64 \
              || echo "::warning::bin/zervermanager-linux-amd64 is stale — run 'make build' and commit bin/"
          else
            echo "::warning::bin/zervermanager-linux-amd64 missing"
          fi
